[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nikos-safebooru-wrapper"
version = "0.1.1"

description = "A Python wrapper for the safebooru.org API"
authors = [
    {name = "Niko"}
]
dependencies = [
    "requests",
    "pydantic",
    "python-magic",
]
license = {text = "Unlicense"}
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
